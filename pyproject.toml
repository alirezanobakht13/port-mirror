[project]
name = "port-mirror"
version = "0.1.0"
description = "Mirror local TCP ports onto a remote server over a self-healing reverse SSH tunnel"
readme = "README.md"
authors = [
    { name = "alirezanobakht13", email = "a.nobakht13@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "paramiko>=5.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
port-mirror = "port_mirror:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
